version: 2
updates:
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  ignore:
  - dependency-name: pytest
  - dependency-name: pytest-asyncio
  commit-message:
    prefix: chore
    prefix-development: build
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: ci
    include: scope
