version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Pinned exactly by pytest-homeassistant-custom-component; updates come
      # through bumps of that package instead.
      - dependency-name: "pytest"
      - dependency-name: "pytest-asyncio"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
